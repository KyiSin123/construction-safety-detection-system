<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance | PPE Safety</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>:root{--ink:#172033;--muted:#637083;--line:#dbe1ea;--blue:#1769d1;--green:#11743a;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:var(--ink);font:14px Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}header{background:#fff;border-bottom:1px solid var(--line)}nav{margin-top:10px;display:flex;flex-wrap:wrap;gap:14px}a{color:var(--muted);text-decoration:none}nav a.active{color:var(--blue);font-weight:700}.grid{display:grid;grid-template-columns:350px 1fr;gap:20px;margin-top:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px}input,textarea,button{font:inherit;padding:10px;border-radius:5px}input,textarea{width:100%;border:1px solid var(--line);margin:8px 0 10px}textarea{min-height:80px;resize:vertical}button{border:0;color:#fff;background:var(--blue);font-weight:700;cursor:pointer;margin:8px 6px 0 0}.out{background:var(--red)}.message{min-height:20px;margin-top:12px;color:var(--red)}.success{color:var(--green)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px}.on-site{color:var(--green);font-weight:700}.audit{color:var(--muted);font-size:12px;margin-top:4px}@media(max-width:800px){.grid{grid-template-columns:1fr}.panel{overflow-x:auto}}</style></head>
<body><header><div class="wrap"><h1><i class="fas fa-shield-alt"></i> Worker Attendance</h1><nav><a href="/"><i class="fas fa-house"></i> Home</a><a href="/admin"><i class="fas fa-gauge-high"></i> Admin dashboard</a><a href="/admin/review"><i class="fas fa-clipboard-list"></i> Violation History</a><a href="/admin/workers"><i class="fas fa-users"></i> Workers</a><a href="/admin/attendance" class="active"><i class="fas fa-calendar-check"></i> Attendance</a><a href="/admin/supervisors"><i class="fas fa-user-shield"></i> Supervisors</a><a href="/admin/settings"><i class="fas fa-gear"></i> Detection Settings</a></nav></div></header><main class="wrap"><div class="grid"><section class="panel"><h2>Admin attendance entry</h2><p>Enter the worker's detected ID number. Manual entries require a time and reason.</p><label>Worker ID number<input id="workerNumber" placeholder="Example: A102" autocomplete="off" autofocus></label><label>Date and time<input id="recordedAt" type="datetime-local"></label><label>Reason<textarea id="reason" placeholder="Explain why this attendance is being entered manually"></textarea></label><button onclick="record('check_in')">Check in</button><button class="out" onclick="record('check_out')">Check out</button><div id="message" class="message"></div></section><section class="panel"><h2>Attendance history</h2><label>Date <input id="date" type="date" onchange="load()"></label><table><thead><tr><th>Worker</th><th>Team</th><th>Check in</th><th>Check out</th><th>Admin audit</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></section></div></main><script>const token=sessionStorage.getItem('supervisor_admin_token');if(!token)window.location.replace('/admin');const pad=v=>String(v).padStart(2,'0');const now=new Date();const localDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const localDateTime=d=>`${localDate(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;date.value=localDate(now);recordedAt.value=localDateTime(now);function request(path,options={}){options.headers={...(options.headers||{}),Authorization:`Bearer ${token}`};return fetch(path,options).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||d.message||'Request failed');return d})}function displayTime(value){return value?new Date(value).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—'}function audit(item){const parts=[];if(item.check_in_reason)parts.push(`<div><strong>In:</strong> ${escape(item.check_in_reason)}</div>`);if(item.check_out_reason)parts.push(`<div><strong>Out:</strong> ${escape(item.check_out_reason)}</div>`);if(item.recorded_by)parts.push(`<div class="audit">Entered by ${escape(item.recorded_by)}</div>`);return parts.join('')||'—'}async function load(){try{const data=await request(`/api/admin/attendance?date=${encodeURIComponent(date.value)}`);rows.innerHTML=data.length?data.map(item=>`<tr><td><strong>${escape(item.worker_number)}</strong><br>${escape(item.name)}</td><td>${escape(item.team||'—')}</td><td>${displayTime(item.check_in_at)}</td><td>${displayTime(item.check_out_at)}</td><td>${audit(item)}</td><td class="${item.check_out_at?'':'on-site'}">${item.check_out_at?'Checked out':'On site'}</td></tr>`).join(''):'<tr><td colspan="6">No attendance records for this date.</td></tr>'}catch(e){rows.innerHTML=`<tr><td colspan="6">${escape(e.message)}</td></tr>`}}async function record(action){const id=workerNumber.value.trim(),time=recordedAt.value,why=reason.value.trim();if(!id){message.textContent='Enter a worker ID number.';return}if(!time){message.textContent='Select the attendance date and time.';return}if(!why){message.textContent='Enter a reason for this admin entry.';return}try{const data=await request('/api/admin/attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({worker_number:id,action,recorded_at:time,reason:why})});message.className='message success';message.textContent=`${data.message}: ${data.worker.name}`;workerNumber.value='';reason.value='';date.value=time.slice(0,10);recordedAt.value=localDateTime(new Date());load()}catch(e){message.className='message';message.textContent=e.message}}function escape(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load()</script></body></html>
